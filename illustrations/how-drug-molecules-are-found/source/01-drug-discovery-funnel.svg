<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172b42"/></linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b7891" stop-opacity=".85"/><stop offset="1" stop-color="#8ec8bd" stop-opacity=".8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#edf6f5} .small{font-size:28px;fill:#a9c5cc} .label{font-size:36px;font-weight:600} .line{stroke:#8fd6d2;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="105" font-size="54" font-weight="700">药物发现：从搜索空间到候选物</text>
  <text x="104" y="155" class="small">示意图：每一层都用新的实验约束淘汰一部分分子</text>
  <g opacity=".9" stroke="#71b9c9" stroke-width="2" fill="none">
    <path d="M120 250 L260 205 L390 275 L525 210 L650 280"/><path d="M160 360 L300 310 L420 380 L565 325 L690 380"/>
    <path d="M260 205 L300 310 M390 275 L420 380 M525 210 L565 325 M650 280 L690 380"/>
  </g>
  <g fill="#7bd4cf" stroke="#d7ffef" stroke-width="3" filter="url(#glow)">
    <circle cx="120" cy="250" r="12"/><circle cx="260" cy="205" r="14"/><circle cx="390" cy="275" r="11"/><circle cx="525" cy="210" r="13"/><circle cx="650" cy="280" r="12"/>
    <circle cx="160" cy="360" r="10"/><circle cx="300" cy="310" r="12"/><circle cx="420" cy="380" r="10"/><circle cx="565" cy="325" r="11"/><circle cx="690" cy="380" r="10"/>
  </g>
  <text x="115" y="470" class="label">候选空间</text><text x="115" y="512" class="small">商业库、旧分子、按需合成库</text>
  <path d="M760 210 L1310 210 L1125 630 L945 630 Z" fill="url(#funnel)" stroke="#b9eee1" stroke-width="5" opacity=".9"/>
  <path d="M800 325 L1260 325 M865 450 L1205 450" stroke="#d5fff3" stroke-width="6" opacity=".75"/>
  <text x="835" y="285" class="label">初筛</text><text x="900" y="285" class="small">测信号，去掉明显无效物</text>
  <text x="900" y="410" class="label">复筛</text><text x="970" y="410" class="small">换方法，排除假阳性</text>
  <text x="1000" y="540" class="label">机制与药代</text>
  <g stroke="#8fd6d2" stroke-width="3" fill="none"><path d="M1015 630 L1015 710"/><path d="M995 690 L1015 715 L1035 690"/></g>
  <g filter="url(#glow)"><circle cx="1015" cy="770" r="38" fill="#f2bd65" stroke="#fff2bd" stroke-width="7"/><path d="M1015 715 L1055 740 L1040 785 L990 800 L970 755 Z" fill="none" stroke="#ffeec0" stroke-width="4"/></g>
  <text x="1100" y="775" class="label">临床候选物</text><text x="1100" y="820" class="small">仍需细胞、动物与人体验证</text>
  <text x="1320" y="240" class="small">结构与表型</text><text x="1320" y="282" class="small">不是一次抽签</text>
</svg>
