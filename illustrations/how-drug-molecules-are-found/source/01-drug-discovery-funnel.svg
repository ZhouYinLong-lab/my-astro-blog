<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="早期药物发现的四个阶段">
  <style>
    text { font-family: Microsoft YaHei, Noto Sans CJK SC, sans-serif; fill: #182d37; }
    .title { font-size: 42px; font-weight: 700; }
    .heading { font-size: 34px; font-weight: 700; }
    .note { font-size: 30px; }
  </style>
  <rect width="1200" height="400" fill="#f3f7f7"/>
  <text x="48" y="75" class="title">早期药物发现的四个阶段</text>
  <rect x="48" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="168" y="188" text-anchor="middle" class="heading">待测分子</text>
  <text x="168" y="241" text-anchor="middle" class="note">选定化合物</text>
  <text x="168" y="282" text-anchor="middle" class="note">和实验读数</text>
  <path d="M298 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="336" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="456" y="188" text-anchor="middle" class="heading">命中物</text>
  <text x="456" y="241" text-anchor="middle" class="note">复测信号</text>
  <text x="456" y="282" text-anchor="middle" class="note">排查假阳性</text>
  <path d="M586 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="624" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="744" y="188" text-anchor="middle" class="heading">先导物</text>
  <text x="744" y="241" text-anchor="middle" class="note">优化活性</text>
  <text x="744" y="282" text-anchor="middle" class="note">和成药性质</text>
  <path d="M874 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="912" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="1032" y="188" text-anchor="middle" class="heading">临床候选物</text>
  <text x="1032" y="241" text-anchor="middle" class="note">评估暴露</text>
  <text x="1032" y="282" text-anchor="middle" class="note">与安全性</text>
