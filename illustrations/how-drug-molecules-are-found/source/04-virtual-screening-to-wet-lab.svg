<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="D₄ 多巴胺受体虚拟筛选">
  <style>
    text { font-family: Microsoft YaHei, Noto Sans CJK SC, sans-serif; fill: #182d37; }
    .title { font-size: 42px; font-weight: 700; }
    .heading { font-size: 34px; font-weight: 700; }
    .note { font-size: 30px; }
  </style>
  <rect width="1200" height="400" fill="#f3f7f7"/>
  <text x="48" y="75" class="title">D₄ 多巴胺受体虚拟筛选</text>
  <rect x="48" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="168" y="188" text-anchor="middle" class="heading">约 1.38 亿</text>
  <text x="168" y="241" text-anchor="middle" class="note">参与虚拟</text>
  <text x="168" y="282" text-anchor="middle" class="note">对接的分子</text>
  <path d="M298 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="336" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="456" y="188" text-anchor="middle" class="heading">589</text>
  <text x="456" y="241" text-anchor="middle" class="note">选中合成</text>
  <text x="456" y="282" text-anchor="middle" class="note">的分子</text>
  <path d="M586 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="624" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="744" y="188" text-anchor="middle" class="heading">549</text>
  <text x="744" y="241" text-anchor="middle" class="note">成功合成</text>
  <text x="744" y="282" text-anchor="middle" class="note">并做结合测试</text>
  <path d="M874 220h26m-9-8 9 8-9 8" fill="none" stroke="#406c70" stroke-width="3"/>
  <rect x="912" y="129" width="240" height="188" rx="12" fill="#fff" stroke="#789ba0" stroke-width="2"/>
  <text x="1032" y="188" text-anchor="middle" class="heading">122</text>
  <text x="1032" y="241" text-anchor="middle" class="note">达到初筛</text>
  <text x="1032" y="282" text-anchor="middle" class="note">结合阈值</text>
  <text x="48" y="365" class="note">初筛阈值：在 10 μM 下置换超过 50% 的标记配体（Lyu 等，2019）</text>
</svg>
