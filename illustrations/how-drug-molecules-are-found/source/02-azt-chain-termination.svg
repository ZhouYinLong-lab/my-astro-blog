<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="DNA 链能否延长，取决于末端的 3′ 基团">
  <style>
    text { font-family: Microsoft YaHei, Noto Sans CJK SC, sans-serif; fill: #182d37; }
    .title { font-size: 42px; font-weight: 700; }
    .heading { font-size: 34px; font-weight: 700; }
    .note { font-size: 30px; }
  </style>
  <rect width="1200" height="400" fill="#f3f7f7"/>
  <text x="48" y="75" class="title">DNA 链能否延长，取决于末端的 3′ 基团</text>
  <rect x="48" y="120" width="1104" height="100" rx="12" fill="#e1efea"/>
  <rect x="48" y="242" width="1104" height="100" rx="12" fill="#f5e6e1"/>
  <g text-anchor="middle">
    <text x="243" y="164" class="heading">正常核苷酸接入</text>
    <text x="243" y="195" class="note">以 dTTP 为例</text>
    <text x="613" y="181" class="heading">末端保留 3′–OH</text>
    <text x="972" y="181" class="heading">可继续延长</text>
    <text x="243" y="286" class="heading">AZT-TP 接入</text>
    <text x="243" y="319" class="note">链末端留下 AZT-MP</text>
    <text x="613" y="303" class="heading">末端为 3′–N₃</text>
    <text x="972" y="303" class="heading">链延长停止</text>
  </g>
  <path d="M414 170h39m-10-9 10 9-10 9 M783 170h39m-10-9 10 9-10 9 M414 292h39m-10-9 10 9-10 9 M783 292h39m-10-9 10 9-10 9" fill="none" stroke="#536e74" stroke-width="3"/>
</svg>
