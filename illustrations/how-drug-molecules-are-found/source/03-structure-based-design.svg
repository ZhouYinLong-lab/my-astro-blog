  <path d="M1110 520 L900 470" stroke="#d8f4d9" stroke-width="4" stroke-dasharray="12 12"/><text x="1140" y="535" class="label">氢键相互作用</text><text x="1140" y="580" class="small">虚线只表示示意关系</text>
