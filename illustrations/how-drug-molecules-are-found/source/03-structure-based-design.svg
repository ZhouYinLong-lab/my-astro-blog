    <radialGradient id="protein"><stop stop-color="#76a7bb" stop-opacity=".82"/><stop offset="1" stop-color="#24485d" stop-opacity=".28"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#eef8f6} .small{font-size:30px;fill:#a9c6cb} .label{font-size:40px;font-weight:600}</style>
